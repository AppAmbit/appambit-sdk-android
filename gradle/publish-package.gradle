apply plugin: 'maven-publish'
apply plugin: 'signing'

ext {
    // Constant variables
    MIN_SDK_VERSION = project.property("MIN_SDK_VERSION")
    VERSION_NAME = project.property("VERSION_NAME")
    VERSION_CODE = project.property("VERSION_CODE")

    // Maven variables
    GROUP_ID = "com.appambit"
    ARTIFACT_ID = "appambit"

    SITE_URL = "https://github.com/AppAmbit/appambit-sdk-android"
    GIT_URL = "https://github.com/AppAmbit/appambit-sdk-android.git"

    POM_DESCRIPTION = "Lightweight SDK for analytics, events, logging, crashes, and offline support. Simple setup, minimal overhead."
    POM_URL = SITE_URL

    LICENCE_NAME = "The MIT License (MIT)"
    LICENCE_SITE = "https://opensource.org/licenses/MIT"
    LICENCE_CODE = "MIT"

    DEVELOPER_ID = "AppAmbit"
    DEVELOPER_NAME = "AppAmbit"
    DEVELOPER_EMAIL = "hello@appambit.com"

}

def ossSigningKey = System.getenv("OSS_SIGNING_KEY")
def ossSigningPassword = System.getenv("OSS_SIGNING_PASSWORD")

signing {
    // Skip signing when no key is present (publishToMavenLocal / local verification).
    // CI still signs because it exports OSS_SIGNING_KEY.
    required { ossSigningKey != null && !ossSigningKey.isEmpty() }
    if (ossSigningKey != null && !ossSigningKey.isEmpty()) {
        useInMemoryPgpKeys(ossSigningKey, ossSigningPassword)
    }
    sign publishing.publications
}

task emptyJavadocsJar(type: Jar) {
    archiveClassifier.set("javadoc")
    from("$buildDir/empty")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // Publishing the AGP `release` component (instead of attaching the AAR as a
                // raw file) is what makes maven-publish emit a <dependencies> block in the
                // POM and a Gradle Module Metadata file. Consumers then get okhttp,
                // appcompat and material transitively instead of having to add them by hand.
                from components.release

                groupId GROUP_ID
                artifactId ARTIFACT_ID
                version VERSION_NAME

                artifact emptyJavadocsJar

                pom {
                    name = ARTIFACT_ID
                    description = POM_DESCRIPTION
                    url = POM_URL
                    licenses {
                        license {
                            name = LICENCE_NAME
                            url = LICENCE_SITE
                        }
                    }
                    developers {
                        developer {
                            id = DEVELOPER_ID
                            name = DEVELOPER_NAME
                            email = DEVELOPER_EMAIL
                        }
                    }
                    scm {
                        connection = GIT_URL
                        developerConnection = GIT_URL
                        url = SITE_URL
                    }
                }
            }
        }
    }
}